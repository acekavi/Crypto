[package]
name = "bot"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "crypto-bot"
path = "src/main.rs"

[[bin]]
name = "download-history"
path = "src/bin/download_history.rs"

[[bin]]
name = "crypto-pairs"
path = "src/bin/pairs.rs"

[lib]
name = "bot"
path = "src/lib.rs"

[dependencies]
botcore = { path = "../crates/botcore" }
engine = { path = "../crates/engine" }
exchange = { path = "../crates/exchange" }
history = { path = "../crates/history" }
indicators = { path = "../crates/indicators" }
pairs = { path = "../crates/pairs" }
persistence = { path = "../crates/persistence" }
risk = { path = "../crates/risk" }
strategy = { path = "../crates/strategy" }
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
hex = "0.4"
thiserror.workspace = true
tokio.workspace = true
toml = "0.8"
tracing.workspace = true
tracing-subscriber.workspace = true
rustls = { version = "0.23", features = ["aws-lc-rs"] }

[dev-dependencies]
async-trait = "0.1"
filetime = "0.2"
rust_decimal_macros.workspace = true
temp-env = "0.3"
tempfile = "3"
