[runtime]
loop_seconds = 60
journal_path = "data/bot.db"
kline_margin_bars = 25

[executor]
ticks_through = 5
fill_timeout_secs = 20
poll_interval_secs = 1
unwind_ladder = [10, 25, 60]
# Temporarily disabled (2026-09-11): a two-leg entry that partially fills on
# both legs is no longer flattened. The unfilled remainder on each leg is
# left resting instead of cancelled, and the position rides at whatever is
# filled now until it hits target_z/stop_z/max_hold_bars, same as any other
# position. A true one-sided fill (only one leg ever touched) is unaffected
# and still unwinds — see ExecutorConfig::unwind_on_partial_fill in
# crates/pairs/src/executor.rs for the exact behavior and its limits.
# Revert by setting this back to true (or deleting the line).
unwind_on_partial_fill = false

[[bot]]
id = "aave_eth"
name = "AAVE/ETH"
priority = 100
leg_a = "AAVEUSDT"
leg_b = "ETHUSDT"
timeframe = "H1"
rolling_window = 210
entry_z = 3.0
stop_z = 4.5
target_z = 0.0
max_hold_bars = 48
fee_per_leg = 0.0002
per_leg_notional_usdt = 25
risk_pct_of_equity = 0.03
max_notional_multiple_of_equity = 1.0
enable_breakeven = false
breakeven_r_multiple = 2.0

