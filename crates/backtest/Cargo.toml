[package]
name = "backtest"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
botcore = { path = "../botcore" }
exchange = { path = "../exchange" }
history = { path = "../history" }
persistence = { path = "../persistence" }
risk = { path = "../risk" }
strategy = { path = "../strategy" }
engine = { path = "../engine" }
# EngineLoop itself lives in the `bot` binary crate's library target, not in
# `engine` — it is the wiring that ties strategy, risk, and executor
# together, and that wiring is exactly what this crate must replay unchanged.
bot = { path = "../../bot" }
async-trait = "0.1"
indicators = { path = "../indicators" }
# Seeded only. Every draw must be reproducible from a recorded seed, so no
# thread_rng anywhere in this crate.
rand = "0.9"
rust_decimal.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
rust_decimal_macros.workspace = true
tempfile = "3"
